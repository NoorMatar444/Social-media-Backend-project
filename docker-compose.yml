services:

  backend:
    build:
      context: .
      target: development
      pull: false

    container_name: Social-media-backend

    ports:
      - "3001:3000"

    env_file:
      - .env.docker

    depends_on:
      - mongodb
      - redis

    volumes:
      - .:/app

  mongodb:
    image: mongo:latest

    container_name: Social-media-mongodb

    ports:
      - "27019:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest

    container_name: Social-media-redis

    ports:
      - "6380:6379"

volumes:
  mongodb_data:
